<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CodBot — Rule-Based Chatbot | CODSOFT Task 1</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b1120;
    --surface:#111a2c;
    --surface2:#182338;
    --accent:#5eead4;
    --accent-dim:#134e4a;
    --text:#e2e8f0;
    --muted:#64748b;
    --line:#22304a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 15% -10%, #14304a 0%, transparent 45%),
      var(--bg);
    color:var(--text);
    font-family:'JetBrains Mono', monospace;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
  }
  .wrap{ width:100%; max-width:640px; }
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    color:var(--accent);
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    margin-bottom:6px;
  }
  h1{
    font-family:'Space Grotesk', sans-serif;
    font-size:30px;
    margin:0 0 4px 0;
    font-weight:700;
  }
  .sub{ color:var(--muted); font-size:13px; margin-bottom:20px;}
  .terminal{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 30px 60px -30px rgba(0,0,0,.6);
  }
  .titlebar{
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px 14px;
    background:var(--surface2);
    border-bottom:1px solid var(--line);
  }
  .dot{width:10px;height:10px;border-radius:50%;}
  .dot.r{background:#f97362;} .dot.y{background:#f7b955;} .dot.g{background:var(--accent);}
  .titlebar span{margin-left:8px;color:var(--muted);font-size:12px;}
  #log{
    height:400px;
    overflow-y:auto;
    padding:18px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .msg{ max-width:80%; padding:10px 13px; border-radius:8px; font-size:13.5px; line-height:1.5; white-space:pre-wrap;}
  .bot{ background:var(--surface2); align-self:flex-start; border:1px solid var(--line); }
  .bot::before{ content:"codbot ~ $ "; color:var(--accent); }
  .user{ background:var(--accent-dim); align-self:flex-end; color:#d1fae5; border:1px solid #1f5f57; }
  .user::before{ content:"you ~ $ "; color:#99f6e4; }
  form{
    display:flex;
    border-top:1px solid var(--line);
    background:var(--surface2);
  }
  input{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color:var(--text);
    font-family:inherit;
    font-size:13.5px;
    padding:14px 16px;
  }
  input::placeholder{ color:var(--muted); }
  button{
    background:var(--accent);
    color:#04211d;
    border:none;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:13px;
    padding:0 22px;
    cursor:pointer;
    letter-spacing:.02em;
  }
  button:hover{ filter:brightness(1.08); }
  footer{ text-align:center; color:var(--muted); font-size:11px; margin-top:18px; }
  #log::-webkit-scrollbar{width:8px;}
  #log::-webkit-scrollbar-thumb{background:var(--line); border-radius:8px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">CODSOFT · Artificial Intelligence Internship · Task 01</div>
  <h1>CodBot — Rule-Based Chatbot</h1>
  <div class="sub">Pattern-matching over regex rules. No ML model — pure if/else logic under the hood.</div>

  <div class="terminal">
    <div class="titlebar">
      <div class="dot r"></div><div class="dot y"></div><div class="dot g"></div>
      <span>codbot.py — running</span>
    </div>
    <div id="log"></div>
    <form id="f">
      <input id="input" autocomplete="off" placeholder="Type a message… (try 'hi', 'help', 'time')" />
      <button type="submit">Send</button>
    </form>
  </div>
  <footer>Built for CODSOFT_TASKSNO · Aryan Singh</footer>
</div>

<script>
// ---------------------------------------------------------------
// Same rule set as task1_chatbot.py, ported to JS for the browser
// ---------------------------------------------------------------
const rules = [
  [/\b(hi|hello|hey|hola)\b/i, ["Hello! How can I help you today?", "Hi there! What's on your mind?", "Hey! Good to see you."]],
  [/\bhow are you\b/i, ["I'm just a bunch of if-else statements, but I'm doing great!", "Running smoothly, thanks for asking!"]],
  [/\byour name\b/i, ["I'm CodBot, your friendly rule-based chatbot."]],
  [/\btime\b/i, [() => `The current time is ${new Date().toLocaleTimeString()}.`]],
  [/\b(date|today)\b/i, [() => `Today's date is ${new Date().toLocaleDateString()}.`]],
  [/\b(bye|goodbye|exit|quit)\b/i, ["Goodbye! Have a great day!", "See you soon!"]],
  [/\b(thanks|thank you)\b/i, ["You're welcome!", "Anytime!"]],
  [/\b(help|what can you do)\b/i, ["I can chat about greetings, tell you the time/date, and respond to simple questions. Try asking me something!"]],
  [/\bcodsoft\b/i, ["CodSoft is a tech education & software development platform offering virtual internships and AI-driven career tools."]],
  [/\bweather\b/i, ["I can't check live weather from here, but I hope it's sunny where you are!"]],
];
const fallback = ["I'm not sure I understand. Could you rephrase that?", "Interesting! Tell me more.", "Hmm, I don't have a rule for that yet.", "Can you elaborate a bit more?"];

function respond(text){
  for(const [pattern, responses] of rules){
    if(pattern.test(text)){
      const choice = responses[Math.floor(Math.random()*responses.length)];
      return typeof choice === "function" ? choice() : choice;
    }
  }
  return fallback[Math.floor(Math.random()*fallback.length)];
}

const log = document.getElementById('log');
function addMsg(text, who){
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

addMsg("Hi! I'm CodBot. Ask me anything (try 'hi', 'help', 'time').", 'bot');

document.getElementById('f').addEventListener('submit', e => {
  e.preventDefault();
  const inp = document.getElementById('input');
  const text = inp.value.trim();
  if(!text) return;
  addMsg(text, 'user');
  inp.value = '';
  setTimeout(() => addMsg(respond(text), 'bot'), 250);
});
</script>
</body>
</html>
